name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build macOS DMG
        run: |
          jpackage \
            --type dmg \
            --input . \
            --main-jar Christmas.jar \
            --name Surpriza

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App
          path: "*.dmg"

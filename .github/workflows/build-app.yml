name: Build Cross-Platform App
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build macOS dmg
        run: |
          jpackage \
            --type dmg \
            --input . \
            --main-jar Christmas.jar \
            --main-class Christmas.ChristmasApp \
            --add-modules ALL-MODULE-PATH \  
            --name ChristmasApp

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App
          path: "*.dmg"

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Windows Installer (MSI)
        run: |
          jpackage `
            --type msi `
            --input . `
            --main-jar Christmas.jar `
            --main-class Christmas.ChristmasApp `
            --add-modules ALL-MODULE-PATH ` 
            --name ChristmasAppWin

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: "*.msi"
